# Compile l'app sur une machine Windows fournie par GitHub.
# Objectif : ne rien avoir à installer sur son propre PC pour obtenir
# l'installateur — il se télécharge à la fin de chaque exécution.
name: Compiler pour Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'tools/preview/**'
  workflow_dispatch:

# Une nouvelle poussée annule la compilation précédente encore en cours.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      # Garde les bibliothèques déjà compilées d'une exécution à l'autre :
      # la première compilation prend ~10 min, les suivantes ~2 min.
      - name: Réutiliser le cache de compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # `npm install` plutôt que `npm ci` : il n'y a pas de verrou npm
      # versionné, npm ne sachant pas en produire un valable sur plusieurs
      # plateformes à la fois. Les versions Rust, elles, sont pinnées par
      # src-tauri/Cargo.lock.
      - name: Installer les dépendances Node
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Compiler l'application
        run: npm run build

      - name: Mesurer la taille du résultat
        shell: pwsh
        run: |
          $rows = @()
          Get-ChildItem -Path src-tauri/target/release -Filter *.exe -File |
            ForEach-Object { $rows += [pscustomobject]@{
              Fichier = $_.Name; Type = 'Exécutable'; Mo = [math]::Round($_.Length / 1MB, 2) } }
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi -File |
            ForEach-Object { $rows += [pscustomobject]@{
              Fichier = $_.Name; Type = 'Installateur'; Mo = [math]::Round($_.Length / 1MB, 2) } }

          if ($rows.Count -eq 0) { throw "Aucun exécutable produit." }

          $rows | Format-Table -AutoSize | Out-String | Write-Host

          "## Taille de l'application" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Fichier | Type | Taille |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|---|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($r in $rows) {
            "| $($r.Fichier) | $($r.Type) | $($r.Mo) Mo |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Publier l'installateur à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Sports-Counter-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Publication d'une version : sur une étiquette v1.2.3, GitHub compile,
  # signe l'installateur avec la clé privée (secret TAURI_SIGNING_PRIVATE_KEY)
  # et publie une Release contenant latest.json. C'est ce fichier que l'app
  # installée consulte pour se mettre à jour toute seule.
  release:
    name: Publier une version signée
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que l'étiquette correspond à la version de l'app
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "L'étiquette ${{ github.ref_name }} ne correspond pas à la version $version de tauri.conf.json. L'app ne verrait pas la mise à jour."
          }

      - name: Vérifier la présence de la clé de signature
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY absent. Voir le README, section « Mises à jour automatiques »."
          }

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Réutiliser le cache de compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Installer les dépendances Node
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Compiler, signer et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Clé générée sans mot de passe : la clé elle-même est le secret.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sports Counter ${{ github.ref_name }}
          releaseBody: Installer la version depuis les fichiers ci-dessous. Les versions déjà installées se mettent à jour toutes seules.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Signature et fichiers de mise à jour : seulement pour une version publiée.
          args: --config src-tauri/tauri.release.conf.json
