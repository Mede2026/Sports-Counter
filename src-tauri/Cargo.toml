[package]
name = "sports-counter"
version = "0.9.3"
description = "Widget flottant de scores sportifs en direct"
edition = "2021"
rust-version = "1.77"
license-file = "../LICENSE"
publish = false

[lib]
name = "sports_counter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `native-tls` fait passer le chiffrement par Schannel, le TLS déjà intégré à
# Windows, au lieu d'embarquer rustls dans l'exécutable.
tauri = { version = "2", features = ["tray-icon", "native-tls"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# Sans ses fonctions par défaut, qui réintroduiraient rustls (plus lourd) :
# comme le reste de l'app, il chiffre avec Schannel, intégré à Windows.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Déjà tiré par Tauri : sert au délai de recadrage du widget.
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }


# Binaire le plus petit possible : c'est une contrainte du projet.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
