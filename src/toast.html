<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sports Counter — Notification</title>
  <link rel="stylesheet" href="toast.css" />
</head>
<body>
  <div class="toast" id="toast">
    <div class="toast__icon" id="icon"></div>
    <div class="toast__text">
      <div class="toast__title" id="title"></div>
      <div class="toast__body" id="body"></div>
    </div>
    <div class="toast__progress" id="progress"></div>
  </div>
  <script type="module" src="toast.js"></script>
</body>
</html>
